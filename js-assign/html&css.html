<!DOCTYPE html>
<html>
<head>
  <style>
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>

<ul id="myList">
  <li>Item One</li>
  <li>Item Two</li>
  <li>Item Three</li>
  <li>Item Four</li>
</ul>

<script>
  var listItems = document.querySelectorAll('#myList li');
  console.log(listItems);
  for (var i = 0; i < listItems.length; i++) {
    console.log(listItems[i].textContent);
    if ((i + 1) % 2 === 0) {
      listItems[i].classList.add('highlight');
      console.log('Added highlight to: ' + listItems[i].textContent);
    }
  }
  console.log('Total list items: ' + listItems.length);
</script>

</body>
</html>
